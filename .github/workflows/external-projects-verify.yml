name: External Projects Verify

# 验证 GitHub 上第三方 AutoCAD AutoLISP 项目能否在本机 AutoCAD 环境正常运行
# 用仓库内已修好的 _ext_test.lsp（含 SECURELOAD 0）+ 运行时替换路径

on:
  push:
    paths:
      - '.github/workflows/external-projects-verify.yml'
      - '_ext_trigger.txt'
      - '_ext_test.lsp'
      - '_ext_test.scr'
  workflow_dispatch:

jobs:
  verify-external:
    runs-on: [self-hosted, windows]
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 克隆外部项目（目录名与测试脚本一致）
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"
          git clone --depth 1 https://github.com/ferhatatesmech/pipe-router-autolisp.git _tmp_pipe-router-autolisp 2>&1 | Out-Null
          git clone --depth 1 https://github.com/ahmed-abdelmotey/AutoCAD-LISP.git _tmp_AutoCAD-LISP 2>&1 | Out-Null
          git clone --depth 1 https://github.com/Jciel/cathedral.git _tmp_cathedral 2>&1 | Out-Null
          Write-Host "克隆完成:"
          Get-ChildItem -Directory | Where-Object { $_.Name -like "_tmp_*" } | Select-Object -ExpandProperty Name

      - name: 替换测试脚本中的路径（GBK 读写）
        shell: powershell
        run: |
          $ws = "${{ github.workspace }}"
          $wsSlash = $ws -replace '\\', '/'
          $gbk = [System.Text.Encoding]::GetEncoding(936)
          $orig = 'd:/My Code/Claude Code/03-AutoCAD-lisp'
          foreach ($f in @("_ext_test.lsp", "_ext_test.scr")) {
            $p = Join-Path $ws $f
            if (Test-Path $p) {
              $c = [System.IO.File]::ReadAllText($p, $gbk)
              $c = $c.Replace($orig, $wsSlash)
              [System.IO.File]::WriteAllText($p, $c, $gbk)
              Write-Host "已替换路径: $f"
            } else {
              Write-Host "缺失文件: $f"
            }
          }
          Write-Host "workspace = $wsSlash"

      - name: 运行 accoreconsole 外部项目测试
        shell: cmd
        continue-on-error: true
        run: |
          "C:\Program Files\Autodesk\AutoCAD 2024\accoreconsole.exe" /s "%GITHUB_WORKSPACE%\_ext_test.scr"

      - name: 显示测试结果
        if: always()
        shell: cmd
        run: |
          if exist "%GITHUB_WORKSPACE%\_ext_result.log" (
            type "%GITHUB_WORKSPACE%\_ext_result.log"
          ) else (
            echo 结果文件未生成 —— accoreconsole 可能未执行脚本
          )

      - name: 上传结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: external-projects-result
          path: _ext_result.log
          if-no-files-found: warn
