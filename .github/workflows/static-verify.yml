name: Static Verify

# 静态验证：无需 CAD，GitHub 托管 runner 运行。
#
# 统一走 run_tests.py --static —— 测试由 tests/verify_*.py 自动发现。
# 不要在这里列举测试文件名：此前手写清单漏掉了 verify_arg_count 和
# verify_or_value_use（正是抓 lay:make 参数不足、or 取值误用的两个），
# 导致这两类 bug 回归时 CI 也不会变红。

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  static-verify:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 运行静态校验（run_tests.py 统一入口，失败即非 0 退出）
        run: python run_tests.py --static
