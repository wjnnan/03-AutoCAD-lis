name: Runtime Verify

# 运行时验证：需要 AutoCAD（accoreconsole），在装有 AutoCAD 的 self-hosted runner 上运行。
#
# 统一走 run_tests.py --runtime —— 本地与 CI 跑的是同一套，测试由
# tests/verify_*_runtime.py 自动发现，路径在运行时生成，无需替换脚本里的硬编码路径。
#
# 说明：自 2026-09-19 起 accoreconsole 在 Agent 的 bash 里也能跑通了
# （此前失败是 MSYS2 把 /s 转成路径所致；run_tests.py 用 subprocess 传参数列表，
#  不经过 shell，不受影响）。

on:
  push:
  workflow_dispatch:

jobs:
  runtime-verify:
    runs-on: [self-hosted, windows]
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 静态 + 运行时验证（失败即非 0 退出，CI 会变红）
        run: python run_tests.py --runtime
