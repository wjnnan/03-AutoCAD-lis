# AutoLISP 静态检查 pre-commit 钩子（pre-commit 框架版）
# 与 install-hooks.bat 安装的普通 git 钩子二选一，不要同时启用。
# 需要先安装框架: pip install pre-commit && pre-commit install
repos:
  - repo: local
    hooks:
      - id: autolisp-static-check
        name: AutoLISP 静态检查
        entry: python run_tests.py --static
        language: system
        pass_filenames: false
        always_run: true
